name: API lock test

# One-off check: can a video uploaded through this API project leave "private"?
# Sets the private test video to unlisted, reads the result, then sets it back to private.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_HORROR: ${{ secrets.YT_REFRESH_TOKEN_HORROR }}
        run: |
          python - <<'EOF'
          import os, time
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          creds = Credentials(None, refresh_token=os.environ["YT_REFRESH_TOKEN_HORROR"],
                              client_id=os.environ["YT_CLIENT_ID"],
                              client_secret=os.environ["YT_CLIENT_SECRET"],
                              token_uri="https://oauth2.googleapis.com/token")
          yt = build("youtube", "v3", credentials=creds, cache_discovery=False)
          vid = "elr56dfhoa4"
          def status():
              return yt.videos().list(part="status", id=vid).execute()["items"][0]["status"]
          def set_privacy(p):
              s = status()
              body = {"id": vid, "status": {"privacyStatus": p, "embeddable": s["embeddable"],
                      "license": s["license"], "publicStatsViewable": s["publicStatsViewable"],
                      "selfDeclaredMadeForKids": s["selfDeclaredMadeForKids"]}}
              return yt.videos().update(part="status", body=body).execute()["status"]["privacyStatus"]
          try:
              print("update returned:", set_privacy("unlisted"))
              time.sleep(5)
              print("after 5 s:", status()["privacyStatus"])
          except Exception as e:
              print("update error:", repr(e)[:500])
          finally:
              print("restored:", set_privacy("private"))
          EOF
