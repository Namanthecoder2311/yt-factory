name: Factory schedule

# Builds the next queued Short for each channel, one per channel per UTC day.
# Queue: episodes/<channel>/queue/*.yaml (name order). An episode is finished when the publish
# job adds it to episodes/<channel>/done.txt. A failed episode is retried at the next slot and
# skipped after 2 failures (episodes/<channel>/failed.txt), so one bad script never blocks the queue.
# Runs 4 times a day: GitHub often starts scheduled runs hours late, and a build stopped by the
# Cloudflare free image quota (not counted as a failure) is simply tried again at the next slot.
on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "horror, kids or all"
        default: "all"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start builds for the next queued episodes
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.channel || 'all' }}
        run: |
          today=$(date -u +%Y-%m-%d)
          runs=$(gh run list -w build.yml -L 40 --json displayTitle,status,conclusion,createdAt)
          for ch in horror kids; do
            [ "$WANT" != "all" ] && [ "$WANT" != "$ch" ] && continue
            busy=$(echo "$runs" | jq --arg c "episodes/$ch/" '[.[] | select((.displayTitle|contains($c)) and .status!="completed")] | length')
            if [ "$busy" -gt 0 ]; then echo "$ch: a build is already running"; continue; fi
            built=$(echo "$runs" | jq --arg c "episodes/$ch/" --arg d "$today" '[.[] | select((.displayTitle|contains($c)) and .conclusion=="success" and (.createdAt|startswith($d)))] | length')
            if [ "$built" -gt 0 ] && [ "$WANT" = "all" ]; then echo "$ch: today's Short is already done"; continue; fi
            touch "episodes/$ch/done.txt" "episodes/$ch/failed.txt"
            next=$(ls episodes/$ch/queue/*.yaml 2>/dev/null | sort | while read f; do
                     grep -qxF "$f" "episodes/$ch/done.txt" && continue
                     [ "$(grep -cxF "$f" "episodes/$ch/failed.txt")" -ge 2 ] && continue
                     echo "$f"; break; done)
            if [ -z "$next" ]; then echo "$ch: queue empty"; continue; fi
            echo "$ch: building $next"
            gh workflow run build.yml -f episode="$next" -f animate=true
          done
