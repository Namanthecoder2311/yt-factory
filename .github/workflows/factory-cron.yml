name: Factory schedule

# Builds the next queued Short for each channel, one per channel per UTC day.
# Queue: episodes/<channel>/queue/*.yaml (name order). An episode is finished when the publish
# job adds it to episodes/<channel>/done.txt. A failed episode is retried at the next slot and
# skipped after 2 failures (episodes/<channel>/failed.txt), so one bad script never blocks the queue.
# Runs 4 times a day: GitHub often starts scheduled runs hours late, and a build stopped by the
# Cloudflare free image quota (not counted as a failure) is simply tried again at the next slot.
on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "horror, kids or all"
        default: "all"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, for the date of the last done.txt change
      - name: Start builds for the next queued episodes
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.channel || 'all' }}
        run: |
          today=$(date -u +%Y-%m-%d)
          runs=$(gh run list -w build.yml -L 40 --json displayTitle,status,conclusion,createdAt)
          pubs=$(gh run list -w publish.yml -L 40 --json displayTitle,status,conclusion,createdAt)
          for ch in horror kids; do
            [ "$WANT" != "all" ] && [ "$WANT" != "$ch" ] && continue
            # After Google's API audit is approved: post one saved Short per channel per day at
            # 10 AM US Eastern (15:00 UTC), next to the new Short that goes out at 6 PM.
            touch "episodes/$ch/backlog.txt"
            saved=$(head -1 "episodes/$ch/backlog.txt" | cut -d' ' -f1)
            if [ "$(tr -d "[:space:]" < API_APPROVED)" = "true" ] && [ -n "$saved" ]; then
              posted=$(echo "$pubs" | jq --arg c "Publish $ch " --arg d "$today" '[.[] | select((.displayTitle|startswith($c)) and (.createdAt|startswith($d)) and .conclusion!="failure" and .conclusion!="cancelled")] | length')
              if [ "$posted" -eq 0 ]; then
                at=$(python3 -c "
          import datetime as d
          n=d.datetime.now(d.timezone.utc); t=n.replace(hour=15,minute=0,second=0,microsecond=0)
          t = t if t > n + d.timedelta(minutes=30) else t + d.timedelta(days=1)
          print(t.strftime('%Y-%m-%dT%H:%M:%SZ'))")
                echo "$ch: posting saved Short from run $saved at $at"
                gh workflow run publish.yml -f build_run_id="$saved" -f channel="$ch" -f publish_at="$at"
              fi
            fi
            busy=$(echo "$runs" | jq --arg c "episodes/$ch/" '[.[] | select((.displayTitle|contains($c)) and .status!="completed")] | length')
            if [ "$busy" -gt 0 ]; then echo "$ch: a build is already running"; continue; fi
            built=$(echo "$runs" | jq --arg c "episodes/$ch/" --arg d "$today" '[.[] | select((.displayTitle|contains($c)) and .conclusion=="success" and (.createdAt|startswith($d)))] | length')
            # done.txt changes only when a Short was posted (or saved), even if a later step of
            # that run failed, so its last commit date tells whether today's Short is out
            last=$(git log -1 --format=%cs -- "episodes/$ch/done.txt")
            if { [ "$built" -gt 0 ] || [ "$last" = "$today" ]; } && [ "$WANT" = "all" ]; then
              echo "$ch: today's Short is already done"; continue; fi
            touch "episodes/$ch/done.txt" "episodes/$ch/failed.txt"
            next=$(ls episodes/$ch/queue/*.yaml 2>/dev/null | sort | while read f; do
                     grep -qxF "$f" "episodes/$ch/done.txt" && continue
                     [ "$(grep -cxF "$f" "episodes/$ch/failed.txt")" -ge 2 ] && continue
                     echo "$f"; break; done)
            if [ -z "$next" ]; then echo "$ch: queue empty"; continue; fi
            echo "$ch: building $next"
            gh workflow run build.yml -f episode="$next" -f animate=true
          done

  # Safety net: a Short whose scheduled time has passed but is still private is made public
  # (or the owner is told), so a posted Short never silently stays hidden.
  check-live:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_HORROR: ${{ secrets.YT_REFRESH_TOKEN_HORROR }}
          YT_REFRESH_TOKEN_KIDS: ${{ secrets.YT_REFRESH_TOKEN_KIDS }}
        run: |
          python - <<'PY'
          import datetime as d, os, subprocess
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          now = d.datetime.now(d.timezone.utc)
          for ch in ("HORROR", "KIDS"):
              creds = Credentials(None, refresh_token=os.environ[f"YT_REFRESH_TOKEN_{ch}"],
                                  client_id=os.environ["YT_CLIENT_ID"],
                                  client_secret=os.environ["YT_CLIENT_SECRET"],
                                  token_uri="https://oauth2.googleapis.com/token")
              yt = build("youtube", "v3", credentials=creds, cache_discovery=False)
              ups = yt.channels().list(part="contentDetails", mine=True).execute()["items"][0] \
                  ["contentDetails"]["relatedPlaylists"]["uploads"]
              ids = [i["contentDetails"]["videoId"] for i in yt.playlistItems().list(
                  part="contentDetails", playlistId=ups, maxResults=10).execute().get("items", [])]
              if not ids:
                  continue
              kids = ch == "KIDS"
              for v in yt.videos().list(part="snippet,status", id=",".join(ids)).execute()["items"]:
                  s = v["status"]
                  title = v["snippet"]["title"]
                  if s.get("selfDeclaredMadeForKids") != kids or s.get("madeForKids") != kids:
                      # audience must match the channel: Wigglo Toons is Made for Kids (COPPA)
                      fix = {"privacyStatus": s["privacyStatus"], "embeddable": s["embeddable"],
                             "license": s["license"], "publicStatsViewable": s["publicStatsViewable"],
                             "selfDeclaredMadeForKids": kids}
                      if s.get("publishAt"):
                          fix["publishAt"] = s["publishAt"]
                      try:
                          s = yt.videos().update(part="status", body={"id": v["id"], "status": fix}).execute()["status"]
                          print(f"{ch}: {title} made-for-kids set to {kids}, now {s.get('madeForKids')}")
                      except Exception as e:
                          s["madeForKids"] = None
                          print(f"{ch}: could not set made-for-kids on {title}: {e!r}"[:400])
                      if s.get("madeForKids") != kids:
                          subprocess.run(["gh", "issue", "create", "--title", f"⚠️ Wrong audience setting: {title}",
                                          "--body", f"Made for Kids should be {kids} but is {s.get('madeForKids')} and "
                                          f"the factory could not fix it. Set it in YouTube Studio: https://youtu.be/{v['id']}"])
                  at = s.get("publishAt")
                  if s["privacyStatus"] != "private" or not at:
                      continue  # only Shorts this factory scheduled
                  if d.datetime.fromisoformat(at.replace("Z", "+00:00")) > now - d.timedelta(minutes=30):
                      continue
                  try:
                      body = {"id": v["id"], "status": {"privacyStatus": "public",
                              "embeddable": s["embeddable"], "license": s["license"],
                              "publicStatsViewable": s["publicStatsViewable"],
                              "selfDeclaredMadeForKids": kids}}
                      got = yt.videos().update(part="status", body=body).execute()["status"]["privacyStatus"]
                      print(f"{ch}: {title} was still private after {at}, now {got}")
                  except Exception as e:
                      print(f"{ch}: could not make {title} public: {e!r}"[:400])
                      subprocess.run(["gh", "issue", "create", "--title", f"⚠️ Still private: {title}",
                                      "--body", f"Scheduled for {at} but still private and the factory could "
                                      f"not make it public: https://youtu.be/{v['id']}\n{e!r}"[:1500]])
          print("check done")
          PY
