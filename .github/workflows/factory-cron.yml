name: Factory schedule

# Builds the next queued Short for each channel every day.
# Queue: episodes/<channel>/queue/*.yaml (name order). An episode is finished when the publish
# job adds it to episodes/<channel>/done.txt. A failed episode is retried the next day and
# skipped after 2 failures (episodes/<channel>/failed.txt), so one bad script never blocks the queue.
on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC, right after Cloudflare's free image quota resets;
                           # Shorts are ready well before US evening (23:00 UTC)
  workflow_dispatch:
    inputs:
      channel:
        description: "horror, kids or all"
        default: "all"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start builds for the next queued episodes
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.channel || 'all' }}
        run: |
          for ch in horror kids; do
            [ "$WANT" != "all" ] && [ "$WANT" != "$ch" ] && continue
            touch "episodes/$ch/done.txt" "episodes/$ch/failed.txt"
            next=$(ls episodes/$ch/queue/*.yaml 2>/dev/null | sort | while read f; do
                     grep -qxF "$f" "episodes/$ch/done.txt" && continue
                     [ "$(grep -cxF "$f" "episodes/$ch/failed.txt")" -ge 2 ] && continue
                     echo "$f"; break; done)
            if [ -z "$next" ]; then echo "$ch: queue empty"; continue; fi
            echo "$ch: building $next"
            gh workflow run build.yml -f episode="$next" -f animate=true
          done
