name: Niche research

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Search queries, separated by |"
        required: true
        default: "animated horror stories|true horror stories animated|scary stories animated|creepypasta animated"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -U yt-dlp
      - name: Find channels
        run: |
          IFS='|' read -ra Q <<< "${{ inputs.queries }}"
          python research/find_channels.py "${Q[@]}"
      - name: Outliers (own-channel multiple)
        run: python research/yt-viral/swipe.py research_out/collected.json --min 2.0 | tee research_out/outliers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: research
          path: research_out/
          retention-days: 14
