name: Write scripts

# Keeps each channel's queue stocked with new Shorts scripts using a free LLM API
# (Gemini, with Groq as backup). Runs daily but only writes when a queue has < 4 waiting.
on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC, before the 00:30 UTC build
  workflow_dispatch:
    inputs:
      count:
        description: "Scripts per channel"
        default: "7"
      test_llm:
        description: "Test one LLM without saving scripts: gemini or groq (empty = normal run)"
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  write:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml requests
      - name: Top up queues
        run: |
          for ch in horror kids; do
            touch "episodes/$ch/done.txt"
            waiting=$(ls episodes/$ch/queue/*.yaml 2>/dev/null | while read f; do grep -qxF "$f" "episodes/$ch/done.txt" || echo "$f"; done | wc -l)
            echo "$ch: $waiting waiting"
            if [ -n "${{ inputs.test_llm }}" ]; then
              python writer/write_episodes.py "$ch" --count 2 --only "${{ inputs.test_llm }}" --dry-run
              continue
            fi
            if [ "$waiting" -lt 4 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              python writer/write_episodes.py "$ch" --count "${{ inputs.count || 7 }}" || \
                gh issue create --title "⚠️ Script writer failed for $ch" \
                  --body "Could not write new scripts (LLM API). Queue has $waiting left. Check GEMINI_API_KEY / GROQ_API_KEY. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
          done
      - name: Commit new scripts
        run: |
          git config user.name "yt-factory bot"; git config user.email "actions@users.noreply.github.com"
          git add episodes/
          git diff --cached --quiet || { git commit -m "Writer: new Shorts scripts"; git pull --rebase -q; git push; }
