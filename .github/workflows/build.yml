name: Build video
run-name: Build ${{ inputs.episode }}

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode YAML path, e.g. episodes/horror/pilot-60s.yaml"
        required: true
      animate:
        description: "Animate scenes that have a hero: prompt on Kaggle (free GPU)"
        type: boolean
        default: true

jobs:
  # Characters, every scene image and the Kaggle hero clips are made once here, so all
  # parallel story jobs share the same faces, images and animation.
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      stories: ${{ steps.count.outputs.stories }}
      quota: ${{ steps.quota.outputs.hit }}
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml pillow numpy opencv-python-headless requests soundfile kaggle six
      - id: count
        run: echo "stories=$(python factory.py count '${{ inputs.episode }}')" >> "$GITHUB_OUTPUT"
      - name: Character references
        run: python factory.py characters '${{ inputs.episode }}'
      - name: Save new character references  # same face in every future episode, no quota spent again
        run: |
          git add characters/
          git diff --cached --quiet && exit 0
          git config user.name "yt-factory bot"; git config user.email "actions@users.noreply.github.com"
          git commit -qm "New character references" && git pull --rebase -q && git push -q
      - name: Scene images
        run: python factory.py images '${{ inputs.episode }}'
      - name: Hero clips on Kaggle
        if: ${{ inputs.animate }}
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python factory.py herojobs '${{ inputs.episode }}' --out hero_jobs.json
          SLUG=$(basename '${{ inputs.episode }}' .yaml)
          if python -c "import json,sys; sys.exit(0 if json.load(open('hero_jobs.json'))['clips'] else 1)"; then
            # one Kaggle kernel per episode, so parallel builds never overwrite each other
            python kaggle/run_on_kaggle.py hero_jobs.json "out/$SLUG" --name "anim-${SLUG:0:30}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: |
            characters/
            out/**/img_*.png
            out/**/clips/*.mp4
            out/**/song.wav
            out/**/report.json
          retention-days: 2
      - id: quota  # Cloudflare free quota used up: not the episode's fault, the schedule retries
        if: failure()
        run: if [ -f CF_QUOTA ]; then echo "hit=true" >> "$GITHUB_OUTPUT"; fi

  story:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        story: ${{ fromJson(needs.prep.outputs.stories) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core

      - name: Python packages (CPU torch)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-depth-v1

      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: .

      - name: Render story ${{ matrix.story }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python factory.py story "${{ inputs.episode }}" --index ${{ matrix.story }}

      - uses: actions/upload-artifact@v4
        with:
          name: story-${{ matrix.story }}
          path: |
            out/**/story_*.mp4
            out/**/img_*.png
          retention-days: 1

  assemble:
    needs: story
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q pyyaml pillow numpy opencv-python-headless requests soundfile
      - uses: actions/download-artifact@v4
        with:
          pattern: story-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v4   # hero clips, for the QA animation check
        with:
          name: prep
          path: .
      - run: python factory.py assemble "${{ inputs.episode }}"
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: |
            out/**/*.mp4
            out/**/thumbnail.jpg
            out/**/contact_sheet.png
            out/**/meta.json
            out/**/upload.json
            out/**/qa.json
            !out/**/story_*.mp4
            !out/**/clips/*.mp4
          retention-days: 90  # saved Shorts wait here until Google's API audit is approved

  # Fully in the cloud: a Short that passed QA is uploaded to its own channel and scheduled for
  # the next 6 PM US Eastern (23:00 UTC). Owner authorized daily auto-publishing (CLAUDE.md).
  publish:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_HORROR: ${{ secrets.YT_REFRESH_TOKEN_HORROR }}
      YT_REFRESH_TOKEN_KIDS: ${{ secrets.YT_REFRESH_TOKEN_KIDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - uses: actions/download-artifact@v4
        with:
          name: final
          path: out
      - name: QA gate, upload, notify
        run: |
          folder=$(dirname "$(ls out/*/upload.json | head -1)")
          read -r ch title pass short <<< "$(python -c "
          import json,sys
          u=json.load(open('$folder/upload.json')); q=json.load(open('$folder/qa.json'))
          print(u['channel'], u['title'].replace(' ','_'), q['pass'], q['size']==[1080,1920])")"
          title=${title//_/ }
          name=$([ "$ch" = kids ] && echo "Wigglo Toons" || echo "Midnight Aisle Tales")
          git config user.name "yt-factory bot"; git config user.email "actions@users.noreply.github.com"
          mark() {  # record the episode in done.txt / failed.txt so the queue moves on
            echo "${{ inputs.episode }}" >> "episodes/$ch/$1"
            git add "episodes/$ch/$1" && git commit -qm "$2" && git pull --rebase -q && git push -q
          }
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$pass" != "True" ]; then
            gh issue create --title "❌ Not posted (QA failed): $title" \
              --body "$name — QA failed, video NOT posted (will retry once, then skip). Details: $(cat $folder/qa.json)
          Run: $run_url"
            mark failed.txt "QA failed: $title"
            exit 0
          fi
          if [ "$short" != "True" ]; then echo "Long video: needs owner go-ahead, not auto-posted."; exit 0; fi
          if [ -z "$YT_REFRESH_TOKEN_HORROR$YT_REFRESH_TOKEN_KIDS" ]; then
            gh issue create --title "📦 Ready but not uploaded: $title" \
              --body "$name — passed QA, but the YouTube API secrets are not set yet, so it was not uploaded. Download it from the run (kept 3 days): $run_url"
            mark done.txt "Built (no upload yet): $title"
            exit 0
          fi
          if [ "$(tr -d "[:space:]" < API_APPROVED 2>/dev/null)" != "true" ]; then
            # Until Google's API audit passes, API uploads stay locked private for good, so the
            # Short is saved (90 days) and the schedule posts it once the audit is approved.
            echo "${{ github.run_id }} ${{ inputs.episode }}" >> "episodes/$ch/backlog.txt"
            git add "episodes/$ch/backlog.txt"
            gh issue create --title "📦 Saved, waiting for Google approval: $title"               --body "$name — passed QA and is saved. It is posted automatically once the YouTube API audit is approved, nothing to do.
          Run: $run_url"
            mark done.txt "Saved (waiting for API approval): $title"
            exit 0
          fi
          at=$(python -c "
          import datetime as d
          n=d.datetime.now(d.timezone.utc); t=n.replace(hour=23,minute=0,second=0,microsecond=0)
          t = t if t > n + d.timedelta(minutes=30) else t + d.timedelta(days=1)
          print(t.strftime('%Y-%m-%dT%H:%M:%SZ'))")
          python uploader/youtube_upload.py "$folder" --channel "$ch" --publish-at "$at"
          url=$(python -c "import json; print(json.load(open('$folder/uploaded.json'))['url'])")
          gh issue create --title "✅ Posted: $title" \
            --body "Channel: $name
          Goes live: $at (6 PM US Eastern / 4:30 AM IST)
          Link: $url
          QA: $(cat $folder/qa.json)"
          echo "${{ github.run_id }} $ch $url" >> published.txt
          git add published.txt
          mark done.txt "Published $title"

  notify-failure:
    needs: [prep, story, assemble, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.prep.outputs.quota }}" = "true" ]; then
            echo "Cloudflare free image quota used up; the schedule retries this episode in a few hours."
            exit 0
          fi
          gh issue create -R "${{ github.repository }}" \
            --title "⚠️ Build failed: ${{ inputs.episode }}" \
            --body "The daily build failed, so nothing was posted. It is retried at the next schedule slot (every 6 hours), and skipped after 2 failures so the next Short still goes out.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ch=$(echo "${{ inputs.episode }}" | cut -d/ -f2)
          git config user.name "yt-factory bot"; git config user.email "actions@users.noreply.github.com"
          echo "${{ inputs.episode }}" >> "episodes/$ch/failed.txt"
          git add "episodes/$ch/failed.txt" && git commit -qm "Build failed: ${{ inputs.episode }}" && git pull --rebase -q && git push -q
