name: Build video

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode YAML path, e.g. episodes/horror/test-v2-mini.yaml"
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stories: ${{ steps.count.outputs.stories }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml pillow numpy opencv-python-headless requests soundfile
      - id: count
        run: echo "stories=$(python factory.py count '${{ inputs.episode }}')" >> "$GITHUB_OUTPUT"
      # Character references are made once here so every parallel story job uses the same faces.
      - name: Character references
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python factory.py characters '${{ inputs.episode }}'
      - uses: actions/upload-artifact@v4
        with:
          name: characters
          path: characters/
          if-no-files-found: ignore
          retention-days: 7

  story:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        story: ${{ fromJson(needs.plan.outputs.stories) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core

      - name: Python packages (CPU torch)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-depth-v1

      - name: Cache generated images (saves Cloudflare quota on re-runs)
        uses: actions/cache@v4
        with:
          path: out/**/img_*.png
          key: img-${{ hashFiles(inputs.episode) }}-${{ matrix.story }}-${{ secrets.CF_API_TOKEN != '' }}

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: characters
          path: characters

      - name: Render story ${{ matrix.story }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python factory.py story "${{ inputs.episode }}" --index ${{ matrix.story }}

      - uses: actions/upload-artifact@v4
        with:
          name: story-${{ matrix.story }}
          path: |
            out/**/story_*.mp4
            out/**/img_*.png
          retention-days: 1

  assemble:
    needs: story
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q pyyaml pillow numpy opencv-python-headless requests soundfile
      - uses: actions/download-artifact@v4
        with:
          pattern: story-*
          path: out
          merge-multiple: true
      - run: python factory.py assemble "${{ inputs.episode }}"
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: |
            out/**/*.mp4
            out/**/thumbnail.jpg
            out/**/contact_sheet.png
            out/**/meta.json
            !out/**/story_*.mp4
          retention-days: 3
