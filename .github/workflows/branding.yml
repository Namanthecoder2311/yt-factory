name: Channel branding

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Branding YAML"
        required: true
        default: "branding/wigglo.yaml"

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y -qq fonts-dejavu-core
      - run: pip install -q pyyaml pillow numpy opencv-python-headless requests soundfile
      - name: Fredoka font (SIL Open Font License)
        run: |
          mkdir -p fonts
          curl -sSL -o fonts/Fredoka.ttf "https://github.com/google/fonts/raw/main/ofl/fredoka/Fredoka%5Bwdth,wght%5D.ttf" || true
      - name: Make profile picture and banner
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python branding/make_branding.py "${{ inputs.config }}" branding_out
      - uses: actions/upload-artifact@v4
        with:
          name: branding
          path: branding_out/
          retention-days: 7
