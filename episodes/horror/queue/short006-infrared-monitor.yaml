    lines:
    - On the monitor screen, a silhouette stood right behind my couch.
    cast:
    - Mia
  - image: close-up of the ceiling corner camera above the television clicking its infrared ring on
    hero: six red infrared LEDs ignite around the camera lens directly facing the viewer
    lines:
