title: Happy Animal Sounds
channel: kids
format: short
hook: ANIMAL SOUNDS WITH BIRDIE! QUACK MOO
youtube:
  title: 'Animal Sounds Song for Toddlers! 🐥 Quack Moo Baa with Birdie #shorts'
  description: Join Birdie, Bunny, and Wigglo as they visit friendly farm animals and make funny sounds!
  tags:
  - animal sounds song
  - farm animals for kids
  - toddler animal song
  - quack moo baa
  - nursery rhymes
  - animal sounds toddlers
  - baby learning
style: cute 3D animated cartoon render for toddlers, soft studio lighting, bright cheerful pastel colors,
  rounded friendly shapes, Pixar quality, vertical composition, no text, no letters, no logos
characters:
  Wigglo:
    look: Wigglo, an adorable round lime-green baby caterpillar with big sparkly brown eyes, rosy cheeks,
      a happy smile, tiny antennae with yellow pom-poms and a small orange beanie hat
  Bunny:
    look: a fluffy pink baby bunny with long ears, big shiny eyes and a tiny white tail
  Birdie:
    look: a round little sky-blue baby bird with a yellow beak and soft fluffy feathers
song:
  caption: country nursery tune, acoustic strumming, banjo accents, gentle woodblock percussion, 114 bpm,
    playful sweet female vocals, sunny farm vibe
  lyrics: '[Verse]

    Hear the happy farm today,

    listen to what friends will say!


    [Chorus]

    Duck says quack, quack, quack!

    Cow says moo, moo, moo!

    Sheep says baa out in the sun,

    animal sounds for everyone!'
  duration: 30
  language: en
